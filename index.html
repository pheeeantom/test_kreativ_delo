<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>ЭМО</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./desktop.css" media="screen and (min-width: 1200px)"/>
  <link rel="stylesheet" href="./mobile.css" media="screen and (max-width: 1200px)"/>
</head>
<body>
  <div class="screen">
    <nav class="screen__nav nav">
      <div class="nav__item">1</div>
      <div class="nav__item">2</div>
      <div class="nav__item">3</div>
      <div class="nav__item">4</div>
      <div class="nav__item">5</div>
      <div class="nav__item">6</div>
    </nav>

    <section class="screen__card card">
      <div class="question">
        <img class="question__image" src="" width="350" alt="" />

        <div class="answer">
          <input type="hidden" id="order" />
          <label class="answer__label" for="answer-input"></label>

          <div class="answer__row">
            <input class="answer__input" id="answer-input" type="text" />
            <button class="answer__button" aria-label="Отправить" disabled>
              <span class="answer__icon answer__icon--idle">
                <svg width="73" height="68" viewBox="0 0 73 68" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M30.387 65.515L1.69298 26.2998C1.39782 25.8964 1.44584 25.337 1.80541 24.9898L14.8532 12.392C15.2893 11.9709 15.9968 12.0317 16.3548 12.5209L29.885 31.0122C30.2803 31.5525 31.0845 31.5593 31.4889 31.0258L53.5712 1.89603C53.9058 1.4546 54.5355 1.36929 54.9756 1.70577L70.3849 13.4894C70.8231 13.8245 70.9072 14.451 70.5729 14.8898L31.9895 65.5305C31.5844 66.0622 30.7817 66.0544 30.387 65.515Z" fill="#D5D5D5" stroke="black" stroke-width="3"/>
                </svg>
              </span>
              <span class="answer__icon answer__icon--active">
                <svg width="73" height="68" viewBox="0 0 73 68" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M30.3871 65.515L1.6931 26.2998C1.39794 25.8964 1.44596 25.337 1.80553 24.9898L14.8533 12.392C15.2894 11.9709 15.9969 12.0317 16.3549 12.5209L29.8851 31.0122C30.2805 31.5525 31.0847 31.5593 31.4891 31.0258L53.5713 1.89603C53.906 1.4546 54.5357 1.36929 54.9757 1.70577L70.385 13.4894C70.8232 13.8245 70.9073 14.451 70.573 14.8898L31.9896 65.5305C31.5845 66.0622 30.7819 66.0544 30.3871 65.515Z" fill="#31A41C" stroke="black" stroke-width="3"/>
                </svg>
              </span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <button class="cancel-button screen__cancel" aria-label="Начать заново">
      <svg width="71" height="72" viewBox="0 0 71 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18.9594 36.7533L1.77451 54.8671C1.40145 55.2603 1.40959 55.8792 1.79287 56.2625L14.8787 69.3483C15.2763 69.7459 15.9235 69.7376 16.3108 69.3299L33.9062 50.8084C34.2901 50.4043 34.9305 50.3921 35.3295 50.7814L54.3971 69.384C54.789 69.7663 55.4154 69.7624 55.8026 69.3753L68.897 56.2808C69.2875 55.8903 69.2875 55.2571 68.897 54.8666L50.8023 36.7719C50.4153 36.3849 50.4113 35.7586 50.7934 35.3667L68.9264 16.7688C69.3039 16.3817 69.3052 15.7645 68.9294 15.3757L55.811 1.80501C55.4226 1.40316 54.7801 1.39771 54.3849 1.79292L35.3112 20.8666C34.9207 21.2571 34.2875 21.2571 33.897 20.8666L16.2864 3.25603C15.9057 2.87533 15.292 2.86438 14.8979 3.23125L1.83365 15.3945C1.43036 15.77 1.4068 16.401 1.78097 16.8055L18.968 35.386C19.3258 35.7729 19.3221 36.371 18.9594 36.7533Z" fill="#C30000" stroke="black" stroke-width="3"/>
      </svg>
    </button>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
